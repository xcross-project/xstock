{
      "enable": true,
      "settings": {
        "bindurls": "http://*:8080;",
        "staticenable": false,
        "staticroute": "res",
        "openapi": {
          "swaggerswitch": true,
          "showlogging": true,
          "documents": [
            {
              "name": "v1",
              "version": "v1",
              "title": "XStock WebAPI Documents",
              "description": "XStock WebAPI Backend Servicentral API Documents",
              "termsofservice": "https://google.com"
            }
          ],
          "injectionxmlcommentsfile": "xpay.lib.xml",
          "securitydefinitions": [
            {
              "key": "bearerAuth",
              "description": "JWT授权（数据将在请求头中进行传递）直接在下面框中输入Bearer {token}(注意：两者之间室一个空格)",
              "name": "Authorization",
              "bearerformat": "JWT",
              "scheme": "bearer"
            }
          ]
        },
        "cors": [
            {
              "policy": "XPAY-CORSPOLICY-ALLOWDOMAINS",
              "trustorigins": [
                "https://localhost:8000",
                "https://localhost:8001"
              ],
              "expiresdays": 30,
              "secretkey": "0123456789ABCDEF",
              "tokenissuer": "xpay.platform",
              "tokenaudience": "xpay.administrators"
            }
        ]
      }
}